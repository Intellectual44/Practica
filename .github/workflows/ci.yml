name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build solution
        run: dotnet build PrintingHouse.slnx -c Release
      - name: Core and API tests
        run: dotnet test PrintingHouse.Tests/PrintingHouse.Tests.csproj -c Release --no-build --logger trx --results-directory TestResults --collect "XPlat Code Coverage"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-api-test-results
          path: TestResults/
          if-no-files-found: ignore

  publish-desktop:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Publish Windows x64
        run: dotnet publish PrintingHouse.Desktop/PrintingHouse.Desktop.csproj -c Release -r win-x64 --self-contained true -o publish/PrintingHouse
      - uses: actions/upload-artifact@v4
        with:
          name: PrintingHouse-win-x64
          path: publish/PrintingHouse/
